name: Android validation and release
on:
  push:
    branches: [master, codex/ui-8.1.0]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish 8.1.0 with the original signing key
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and lint
        run: bash gradlew assembleDebug assembleDebugAndroidTest lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: tijian-8.1.0-preview
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
      - name: Run Android regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: bash gradlew connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: app/build/outputs/androidTest-results/
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore original keystore
        env:
          SIGNING_KEY: ${{ secrets.TIJIAN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "Original Android keystore is required for compatible upgrades." >&2
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/tijian.keystore"
      - name: Publish verified APK and update metadata
        env:
          TIJIAN_KEYSTORE: ${{ runner.temp }}/tijian.keystore
          TIJIAN_STORE_PASSWORD: ${{ secrets.TIJIAN_STORE_PASSWORD }}
          TIJIAN_KEY_ALIAS: ${{ secrets.TIJIAN_KEY_ALIAS }}
          TIJIAN_KEY_PASSWORD: ${{ secrets.TIJIAN_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh 8.1.0 "$(cat docs/releases/8.1.0.md)"
