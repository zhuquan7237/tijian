<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="katex.min.css">
<style>
  /* 夜读台配色。与 ui/Theme.kt 的 token 一一对应，改色时两边同步。 */
  :root {
    --bg: #171614;          /* Bg */
    --card: #221F1C;        /* CardBg */
    --surface-alt: #2C2926; /* SurfaceAlt */
    --ink: #F4EFE8;         /* Ink */
    --ink2: #D6D0C6;        /* Ink2 */
    --muted: #A8A199;       /* Muted */
    --line: #3C3833;        /* Line */
    --accent: #B7C0F0;      /* Accent */
    --accent-soft: #2A2E44; /* AccentSoft */
    --accent-rgb: 183,192,240;
    --red: #F0A3A3;         /* Red */
    --red-soft: #3D2628;    /* RedSoft */
    --amber: #E4C27A;       /* Amber */
    --amber-soft: #3A3120;  /* AmberSoft */
  }
  /* 日间书桌，与 renderer.html 的 rt-day 保持一致 */
  body.rt-day {
    --bg: #F6F3EC; --card: #FFFCF7; --surface-alt: #EFEAE2;
    --ink: #1C1917; --ink2: #44403C; --muted: #78716C; --line: #E6E0D4;
    --accent: #3E4C7E; --accent-soft: #E6E8F3; --accent-rgb: 62,76,126;
    --red: #B4454C; --red-soft: #F8E8E9;
    --amber: #8F6420; --amber-soft: #F8F0DE;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: transparent;
    -webkit-text-size-adjust: 100%;
    font-family: -apple-system, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", sans-serif;
    color: var(--ink); font-size: 14px; line-height: 1.6;
    /* 原生文字选择：手柄/放大镜/菜单由系统提供，原生菜单被原生层替换为「复制 / 追问」 */
    -webkit-user-select: text; user-select: text;
  }
  #out { padding: 14px 14px 18px; }
  .row { display: flex; margin: 0 0 10px; }
  .row.user { justify-content: flex-end; }
  .row.ai { justify-content: flex-start; }
  .row:last-child { margin-bottom: 0; }
  .bubble {
    max-width: 82%; padding: 9px 13px; border-radius: 18px 18px 6px 18px;
    background: var(--accent-soft); color: var(--ink);
  }
  .card {
    width: 100%; padding: 11px 13px 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px 16px 16px 6px;
  }
  .who { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 7px; letter-spacing: 0; }
  p { margin: 0 0 7px; }
  p:last-child { margin-bottom: 0; }
  h1,h2,h3,h4 { margin: 12px 0 6px; line-height: 1.35; color: var(--ink); }
  h1 { font-size: 17px; } h2 { font-size: 16px; } h3 { font-size: 15px; } h4 { font-size: 14px; }
  ul, ol { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 2px 0; }
  blockquote {
    margin: 8px 0; padding: 2px 0 2px 10px;
    border-left: 3px solid var(--accent); color: var(--ink2); background: var(--accent-soft);
  }
  code { background: var(--surface-alt); border-radius: 4px; padding: 1px 4px; font-size: .92em; }
  pre { background: var(--surface-alt); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; }
  pre code { background: transparent; padding: 0; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: .92em; }
  th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: var(--surface-alt); }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .katex { font-size: 1em; }
  .math-inline { display: inline-block; vertical-align: baseline; max-width: 100%; }
  .math-inline > .katex { vertical-align: baseline; padding: 0; }
  .math-display { display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 8px 0; }
  .math-display .katex-display { margin: 0; padding: .1em 0; }
  .math-display .katex-display > .katex { text-align: left; }
  .rt-error { color: var(--red); background: var(--red-soft); border-radius: 6px; padding: 1px 5px; font-size: .9em; }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 0 8px; }
  /* 消息底部的复制按钮：小而不抢戏 */
  .copy-row { display: flex; justify-content: flex-start; margin-top: 8px; }
  .copy-btn {
    font-size: 11px; color: var(--muted); background: var(--surface-alt);
    border: none; border-radius: 999px; padding: 3px 11px;
  }
  .copy-btn:active { color: var(--accent); }
  /* ---------- 结构化解析（structure.js） ---------- */
  .an-prose { margin: 0 0 12px; }
  .an-box { border-radius: 12px; padding: 10px 12px 11px; margin: 0 0 12px; }
  .an-box:last-child { margin-bottom: 0; }
  .an-think { background: var(--surface-alt); }
  .an-pit { background: var(--amber-soft); }
  .an-concl { background: var(--accent-soft); border: 1px solid rgba(var(--accent-rgb),.32); }
  .an-tag { display: block; font-size: 11px; line-height: 1.4; font-weight: 700; letter-spacing: 0; margin-bottom: 3px; }
  .an-think .an-tag { color: var(--muted); }
  .an-pit .an-tag { color: var(--amber); }
  .an-concl .an-tag { color: var(--accent); }
  .an-steps { list-style: none; margin: 0 0 12px; padding: 0; }
  .an-steps:last-child { margin-bottom: 0; }
  .an-step { position: relative; display: flex; gap: 12px; margin: 0; padding: 0 0 14px; line-height: inherit; }
  .an-step:last-child { padding-bottom: 2px; }
  .an-step::before { content: ''; position: absolute; left: 11px; top: 28px; bottom: 4px; width: 1px; background: var(--line); }
  .an-step:last-child::before { display: none; }
  .an-n {
    flex: 0 0 23px; height: 23px; margin-top: 3px; border-radius: 50%;
    border: 1px solid rgba(var(--accent-rgb),.55); color: var(--accent);
    font-size: 12px; font-weight: 700; line-height: 21px; text-align: center; font-variant-numeric: tabular-nums;
  }
  .an-body { flex: 1 1 auto; min-width: 0; }
  .an-body > :last-child { margin-bottom: 0; }
  .an-lead { font-weight: 600; color: var(--ink); line-height: 1.6; margin: 1px 0 2px; }
  .an-body .math-display { margin: 6px 0; padding: 4px 10px; border-radius: 8px; background: rgba(var(--accent-rgb),.05); }
</style>
</head>
<body>
<div id="out"></div>
<script src="katex.min.js"></script>
<script src="mhchem.min.js"></script>
<script src="markdown-it.min.js"></script>
<script src="mathprep.js"></script>
<script src="structure.js"></script>
<script>
(function () {
  var MSGS = [];
  var md = window.markdownit({ html: false, linkify: true, breaks: false, typographer: false });

  function renderMd(raw) {
    var blocks = [];
    var stash = function (tex, display) {
      blocks.push({ tex: tex, display: display });
      return '@@M' + (blocks.length - 1) + '@@';
    };
    // 与 renderer.html 共用 mathprep.js：漏写闭合 $、裸 LaTeX 都不会再直显。
    var src = window.tjMath.prepare(raw || '', stash);

    var html = md.render(src);
    html = html.replace(/@@M(\d+)@@/g, function (m, idx) {
      var b = blocks[+idx];
      if (!b) return m;
      try {
        var out = katex.renderToString(b.tex, {
          displayMode: b.display, throwOnError: false, strict: false, trust: false, output: 'html'
        });
        return '<span class="' + (b.display ? 'math-display' : 'math-inline') + '">' + out + '</span>';
      } catch (e) {
        return '<span class="rt-error">[公式]</span>';
      }
    });
    html = html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, '</table></div>');
    return html;
  }

  function renderAll(scrollBottom) {
    var out = document.getElementById('out');
    if (!MSGS.length) {
      out.innerHTML = '<div class="empty">可以问解析里的任何一步；长按回答里的文字可选取并复制。</div>';
      return;
    }
    out.innerHTML = MSGS.map(function (m, i) {
      if (m.role === 'user') {
        return '<div class="row user"><div class="bubble">' + renderMd(m.text || '') + '</div></div>';
      }
      var body = (window.tjStructure && window.tjStructure(m.text || '', renderMd)) || renderMd(m.text || '');
      var copyBtn = '<div class="copy-row"><button class="copy-btn" data-copy="' + i + '">复制全文</button></div>';
      return '<div class="row ai"><div class="card"><div class="who">题笺 AI</div>' + body + copyBtn + '</div></div>';
    }).join('');
    var bodyPx = parseFloat(getComputedStyle(document.body).fontSize) || 14;
    var cap = bodyPx * 1.7;
    var nodes = out.querySelectorAll('.math-inline > .katex');
    for (var n = 0; n < nodes.length; n++) {
      var el = nodes[n];
      var h = el.getBoundingClientRect().height;
      if (h > cap + 0.5) {
        var fs = parseFloat(getComputedStyle(el).fontSize) || bodyPx;
        el.style.fontSize = (fs * cap / h) + 'px';
      }
    }
    if (scrollBottom) {
      requestAnimationFrame(function () { window.scrollTo(0, document.body.scrollHeight); });
      setTimeout(function () { window.scrollTo(0, document.body.scrollHeight); }, 120);
    }
  }

  /* 点「复制全文」：走原生剪贴板（带 toast） */
  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('.copy-btn') : null;
    if (!t) return;
    var idx = t.getAttribute('data-copy');
    var text = idx !== null && MSGS[+idx] ? (MSGS[+idx].text || '') : '';
    if (text && window.AndroidChat && window.AndroidChat.copy) {
      window.AndroidChat.copy(text);
    }
  });

  window.__setMessages = function (json) {
    try { MSGS = JSON.parse(json) || []; } catch (e) { MSGS = []; }
    renderAll(true);
  };

  window.__setNight = function (night) {
    document.body.classList.toggle('rt-day', !night);
  };

  window.__scrollBottom = function () {
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  };

  renderAll(false);
  window.onerror = function (m, s2, l) { console.log('chat err: ' + m + ' @' + l); };
})();
</script>
</body>
</html>
