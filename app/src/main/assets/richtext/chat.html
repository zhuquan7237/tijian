<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="katex.min.css">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: transparent;
    -webkit-text-size-adjust: 100%;
    font-family: -apple-system, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", sans-serif;
    color: #212121; font-size: 14px; line-height: 1.62;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #out { padding: 12px 14px 16px; }
  .row { display: flex; margin: 0 0 12px; }
  .row.user { justify-content: flex-end; }
  .row.ai { justify-content: flex-start; }
  .bubble {
    max-width: 84%; padding: 9px 12px; border-radius: 22px;
    background: #F0F0F0; color: #212121;
  }
  .card {
    width: 100%; padding: 10px 12px;
    background: #FFFFFF; border: none;
    border-radius: 0;
  }
  .who { font-size: 11px; font-weight: 600; color: #606060; margin-bottom: 8px; }
  p { margin: 0 0 7px; }
  p:last-child { margin-bottom: 0; }
  h1,h2,h3,h4 { margin: 12px 0 6px; line-height: 1.35; color: #212121; }
  h1 { font-size: 17px; } h2 { font-size: 16px; } h3 { font-size: 15px; } h4 { font-size: 14px; }
  ul, ol { margin: 4px 0 8px; padding-left: 20px; }
  li { margin: 2px 0; }
  blockquote {
    margin: 8px 0; padding: 2px 0 2px 10px;
    border-left: 3px solid #B9C6E8; color: #4A5566; background: #F7F9FE;
  }
  code { background: #F1F3F7; border-radius: 4px; padding: 1px 4px; font-size: .92em; }
  pre { background: #F7F8FB; border: 1px solid #E6E9F0; border-radius: 8px; padding: 8px 10px; overflow-x: auto; }
  pre code { background: transparent; padding: 0; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: .92em; }
  th, td { border: 1px solid #E3E7F0; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #F0F2F7; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .katex { font-size: 1.04em; }
  .math-inline { display: inline-block; vertical-align: middle; max-width: 100%; }
  .math-display { display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 8px 0; }
  .math-display .katex-display { margin: 0; padding: .1em 0; }
  .math-display .katex-display > .katex { text-align: left; }
  .rt-error { color: #C34D55; background: #FFF1F2; border-radius: 6px; padding: 1px 5px; font-size: .9em; }
  .rt-hl { background: rgba(53,92,206,.14); border-radius: 3px; }
  .empty { color: #596372; font-size: 13px; padding: 4px 0 8px; }
</style>
</head>
<body>
<div id="out"></div>
<script src="katex.min.js"></script>
<script src="mhchem.min.js"></script>
<script src="markdown-it.min.js"></script>
<script>
(function () {
  var MSGS = [];
  var md = window.markdownit({ html: false, linkify: true, breaks: false, typographer: false });

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function stashFactory(blocks) {
    return function (tex, display) {
      blocks.push({ tex: tex, display: display });
      return '@@M' + (blocks.length - 1) + '@@';
    };
  }

  function wrapBare(line) {
    if (line.indexOf('$') !== -1) return line;
    if (line.indexOf('\\') === -1) return line;
    return line.replace(/[^\u4e00-\u9fff]+/g, function (seg) {
      if (!/\\[a-zA-Z]+/.test(seg)) return seg;
      if (/^\s*$/.test(seg)) return seg;
      if (/^\s*(#{1,6}\s|>|\||```)/.test(line)) return seg;
      return '$' + seg + '$';
    });
  }

  function renderMd(raw) {
    var blocks = [];
    var stash = stashFactory(blocks);
    var src = raw.split('\n').map(wrapBare).join('\n');
    src = src.replace(/\$\$([\s\S]+?)\$\$/g, function (m, p1) { return stash(p1, true); });
    src = src.replace(/\\\[([\s\S]+?)\\\]/g, function (m, p1) { return stash(p1, true); });
    src = src.replace(/\\\(([\s\S]+?)\\\)/g, function (m, p1) { return stash(p1, false); });
    src = src.replace(/(^|[^\\$])\$(?!\$)([^\n$]+?)\$/g, function (m, pre, p1) { return pre + stash(p1, false); });
    // 截断的回答：未闭合的定界符整段兜底，避免漏出 TeX 源码
    src = src.replace(/\$\$([\s\S]*)$/g, function (m, p1) { return stash(p1, true); });
    src = src.replace(/\\\[([\s\S]*)$/g, function (m, p1) { return stash(p1, true); });
    src = src.replace(/\\\(([\s\S]*)$/g, function (m, p1) { return stash(p1, false); });
    src = src.replace(/\$/g, '');

    var html = md.render(src);
    html = html.replace(/@@M(\d+)@@/g, function (m, idx) {
      var b = blocks[+idx];
      if (!b) return m;
      try {
        var out = katex.renderToString(b.tex, {
          displayMode: b.display, throwOnError: false, strict: false, trust: false, output: 'html'
        });
        return '<span class="' + (b.display ? 'math-display' : 'math-inline') + '">' + out + '</span>';
      } catch (e) {
        try {
          var retry = katex.renderToString(b.tex, {
            displayMode: b.display, throwOnError: true, strict: false, trust: false, output: 'html',
            macros: (window.__rtMacros || {})
          });
          return '<span class="' + (b.display ? 'math-display' : 'math-inline') + '">' + retry + '</span>';
        } catch (e2) {
          return '<span class="rt-error">[公式]</span>';
        }
      }
    });
    html = html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, '</table></div>');
    return html;
  }

  function renderAll(scrollBottom) {
    var out = document.getElementById('out');
    if (!MSGS.length) {
      out.innerHTML = '<div class="empty">可以问解析里的任何一步，也可以长按解析中的文字选择「追问」。</div>';
      return;
    }
    out.innerHTML = MSGS.map(function (m, i) {
      if (m.role === 'user') {
        return '<div class="row user"><div class="bubble">' + renderMd(m.text || '') + '</div></div>';
      }
      return '<div class="row ai"><div class="card"><div class="who">题笺 AI</div>' + renderMd(m.text || '') + '</div></div>';
    }).join('');
    if (scrollBottom) {
      requestAnimationFrame(function () { window.scrollTo(0, document.body.scrollHeight); });
      setTimeout(function () { window.scrollTo(0, document.body.scrollHeight); }, 120);
    }
  }

  window.__setMessages = function (json) {
    try { MSGS = JSON.parse(json) || []; } catch (e) { MSGS = []; }
    renderAll(true);
  };

  window.__scrollBottom = function () {
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  };

  /* ---------- 长按选词 / 拖动扩选，不弹系统菜单 ---------- */
  var pressTimer = null, startX = 0, startY = 0;
  var anchorNode = null, anchorOffset = 0, selecting = false, lastText = '';

  function caretAt(x, y) {
    if (document.caretRangeFromPoint) return document.caretRangeFromPoint(x, y);
    if (document.caretPositionFromPoint) {
      var p = document.caretPositionFromPoint(x, y);
      if (!p) return null;
      var r = document.createRange();
      r.setStart(p.offsetNode, p.offset);
      r.collapse(true);
      return r;
    }
    return null;
  }

  function isWordChar(ch) { return /[A-Za-z0-9\u4e00-\u9fff]/.test(ch); }


  function resolveText(range) {
    if (!range || !range.startContainer) return null;
    var n = range.startContainer;
    if (n.nodeType === 3) return { node: n, offset: range.startOffset };
    var el = n;
    var child = el.childNodes[Math.min(range.startOffset, el.childNodes.length - 1)];
    while (child) {
      if (child.nodeType === 3) return { node: child, offset: 0 };
      if (child.firstChild) { child = child.firstChild; continue; }
      break;
    }
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    var t = walker.nextNode();
    return t ? { node: t, offset: 0 } : null;
  }

  function wordRange(node, offset) {
    var text = node.data || '';
    var s = Math.min(offset, text.length);
    var e = s;
    while (s > 0 && isWordChar(text[s - 1])) s--;
    while (e < text.length && isWordChar(text[e])) e++;
    if (s === e) {
      // 标点 / 公式符号：至少选中当前字符
      s = Math.max(0, Math.min(offset, text.length - 1));
      e = Math.min(text.length, s + 1);
    }
    var r = document.createRange();
    r.setStart(node, s);
    r.setEnd(node, e);
    return r;
  }

  function pushSelection(text) {
    text = (text || '').replace(/\s+/g, ' ').trim();
    if (text === lastText) return;
    lastText = text;
    if (window.AndroidChat) {
      if (text && window.AndroidChat.select) window.AndroidChat.select(text);
      else if (!text && window.AndroidChat.clearSelection) window.AndroidChat.clearSelection();
    }
  }

  function applySelection(range) {
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    pushSelection(range.toString());
  }

  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    clearTimeout(pressTimer);
    selecting = false;
    pressTimer = setTimeout(function () {
      var r = caretAt(startX, startY);
      var hit = resolveText(r);
      if (!hit) return;
      anchorNode = hit.node;
      anchorOffset = hit.offset;
      selecting = true;
      applySelection(wordRange(anchorNode, anchorOffset));
      if (navigator.vibrate) navigator.vibrate(8);
    }, 380);
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (!e.touches.length) return;
    if (!selecting) {
      var dx = e.touches[0].clientX - startX;
      var dy = e.touches[0].clientY - startY;
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) clearTimeout(pressTimer);
      return;
    }
    e.preventDefault();
    var r = caretAt(e.touches[0].clientX, e.touches[0].clientY);
    if (!r || !r.startContainer || r.startContainer.nodeType !== 3) return;
    var range = document.createRange();
    try {
      range.setStart(anchorNode, anchorOffset);
      if (r.startContainer === anchorNode) {
        range.setEnd(anchorNode, r.startOffset);
      } else {
        range.setEnd(r.startContainer, r.startOffset);
      }
      applySelection(range);
    } catch (err) {}
  }, { passive: false });

  document.addEventListener('touchend', function () {
    clearTimeout(pressTimer);
    selecting = false;
  }, { passive: true });

  document.addEventListener('contextmenu', function (e) { e.preventDefault(); return false; });
  document.addEventListener('selectstart', function (e) { e.preventDefault(); });

  renderAll(false);
  window.onerror = function (m, s2, l) { console.log('chat err: ' + m + ' @' + l); };
})();
</script>
</body>
</html>
